steps:
  # 1. CI Part: Build the Docker Image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'us-central1-docker.pkg.dev/project-eab1f4fd-448e-49b4-9d8/my-apps/ecommerce-web', '.']

  # 2. CI Part: Push the image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'us-central1-docker.pkg.dev/project-eab1f4fd-448e-49b4-9d8/my-apps/ecommerce-web']

  # 3. CD Part: Deploy to Google Cloud Run
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'ecommerce-site'
      - '--image'
      - 'us-central1-docker.pkg.dev/project-eab1f4fd-448e-49b4-9d8/my-apps/ecommerce-web'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port=80'

options:
  logging: CLOUD_LOGGING_ONLY